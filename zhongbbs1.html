<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>RED HERRING BBS - 搜索结果：钟溯</title>
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "NSimSun", "SimSun", "Courier New", monospace; 
        }

        /* 绝对铺满的背景，不被遮挡 */
        body {
            background-image: url('鱼.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #000;
            color: #a30000;
            overflow-x: hidden;
        }

        /* 极度透明的血色呼吸层，只加氛围 */
        .blood-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(163, 0, 0, 0.15);
            z-index: 1; 
            pointer-events: none; 
            animation: pulseBg 4s infinite alternate;
        }

        /* 模拟老式CRT显示器的极细扫描线 */
        .crt-scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 2px;
            z-index: 2; 
            pointer-events: none; 
        }

        @keyframes pulseBg {
            0% { background-color: rgba(163, 0, 0, 0.05); }
            100% { background-color: rgba(163, 0, 0, 0.25); }
        }

        /* 论坛主容器 */
        .bbs-container {
            width: 85%;
            max-width: 1000px;
            margin: 40px auto;
            position: relative;
            z-index: 10; 
        }

        /* 顶部导航与面包屑（左上角返回首页） */
        .nav-bar {
            margin-bottom: 30px;
            padding: 12px 20px;
            background: rgba(15, 0, 0, 0.85);
            border: 1px solid rgba(150, 0, 0, 0.6);
            font-size: 15px;
            color: #888;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .nav-bar a {
            color: #ff3333;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .nav-bar a:hover {
            color: #fff;
            text-shadow: 0 0 8px #ff0000;
        }

        /* 搜索框区域 */
        .search-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .search-box {
            background: rgba(10, 0, 0, 0.7);
            border: 1px solid #7a0000;
            color: #ff1a1a;
            padding: 12px 20px;
            font-size: 16px;
            width: 50%;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            transition: all 0.3s;
        }

        .search-box:focus {
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6), inset 0 0 10px rgba(0,0,0,0.8);
        }

        .search-btn {
            background: #2a0000;
            border: 1px solid #7a0000;
            color: #ff3333;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            margin-left: -5px;
            transition: all 0.3s;
        }

        .search-btn:hover {
            background: #5a0000;
            color: #fff;
            border-color: #ff0000;
        }

        /* 搜索结果状态文字 */
        .search-status {
            color: #ff1a1a;
            font-size: 14px;
            margin-bottom: 15px;
            border-left: 3px solid #ff0000;
            padding-left: 10px;
            background: rgba(50, 0, 0, 0.4);
            padding-top: 5px;
            padding-bottom: 5px;
            letter-spacing: 1px;
        }

        /* 帖子列表表格 (极高透明度，完全露出背景里的鱼) */
        .thread-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(0, 0, 0, 0.45); 
            border: 1px solid rgba(150, 0, 0, 0.4);
        }

        .thread-table th {
            background: rgba(30, 0, 0, 0.7);
            color: #cc0000;
            padding: 10px;
            text-align: left;
            border-bottom: 2px solid #7a0000;
            font-weight: normal;
        }

        .thread-table td {
            padding: 15px 10px;
            border-bottom: 1px solid rgba(80, 0, 0, 0.4);
            color: #aaa;
        }

        .thread-table tr:hover {
            background: rgba(80, 0, 0, 0.6);
        }

        /* 帖子标题链接 */
        .thread-title {
            color: #ff4444;
            text-decoration: none;
            font-size: 15px;
            display: block;
            transition: color 0.2s;
            text-shadow: 1px 1px 2px #000;
            line-height: 1.4;
        }

        .thread-title:hover {
            color: #ff8888;
            text-decoration: underline;
        }

        .hot-post {
            color: #ff0000;
            font-weight: bold;
            animation: textFlicker 1.5s infinite;
        }
        
        @keyframes textFlicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .normal-tag {
            color: #888;
        }

        .author {
            color: #b30000;
            font-size: 13px;
            font-weight: bold;
        }

        .date {
            color: #777;
            font-size: 12px;
        }
        
        .replies {
            color: #8a0000;
            text-align: center;
            font-weight: bold;
        }

        /* 被涂黑/删除的系统记录，增加神秘感 */
        .deleted-record {
            text-decoration: line-through;
            color: #444;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- 视觉特效层 -->
    <div class="blood-overlay"></div>
    <div class="crt-scanlines"></div>

    <div class="bbs-container">
        
        <!-- 左上角返回首页 -->
        <div class="nav-bar">
            &lt;&lt; <a href="bbs.html">返回饵料池 (Return to Feed)</a>
        </div>

        <!-- 搜索框区域 -->
        <div class="search-area">
            <input type="text" class="search-box" placeholder="请输入鱼饵的名字...">
            <button class="search-btn">投喂</button>
        </div>

        <!-- 搜索状态提示 -->
        <div class="search-status">
            SYSTEM MATCH: 检索词 [钟溯] - 发现 1 条伴随强烈怨念的关联记录。
        </div>

        <!-- 搜索结果列表 -->
        <table class="thread-table">
            <thead>
                <tr>
                    <th width="65%">匹配的饵料 (Thread)</th>
                    <th width="15%">投饵人 (Author)</th>
                    <th width="10%" style="text-align:center;">撕咬 (Replies)</th>
                    <th width="10%">时间 (Time)</th>
                </tr>
            </thead>
            <tbody>
                <!-- 核心线索帖，点击跳转到详情页 -->
                <tr>
                    <td>
                        <a href="zhongbbs2.html" class="thread-title">
                            <span class="hot-post">[血腥爆料]</span> 《实验中学女播音员夏唯人肉纪实·高档酒店开房图曝光》
                        </a>
                    </td>
                    <td class="author" style="color: #ff3333; text-shadow: 0 0 5px red;">夜游神</td>
                    <td class="replies" style="color: #ff0000;">9,999+</td>
                    <td class="date">2006-05-15</td>
                </tr>

                <!-- 用来增加惊悚氛围的已删除系统记录 -->
                <tr>
                    <td>
                        <span class="deleted-record">
                            [系统吞噬] 发帖人“夜游神”的精神状态已越界，本帖部分极端内容已被胃酸溶解。
                        </span>
                    </td>
                    <td class="author" style="color: #444;">SYSTEM_GOD</td>
                    <td class="replies">-</td>
                    <td class="date">2006-05-16</td>
                </tr>

                <!-- 无关的惊悚环境帖 -->
                <tr>
                    <td>
                        <span class="thread-title" style="color: #555;">
                            <span class="normal-tag">[呓语]</span> 为什么排水管里一直有指甲抓挠铁皮的声音？有人能听到吗？
                        </span>
                    </td>
                    <td class="author" style="color: #666;">失聪者</td>
                    <td class="replies">44</td>
                    <td class="date">2006-05-11</td>
                </tr>
            </tbody>
        </table>

    </div>

    <!-- 引用外部跳转逻辑，保证搜索框继续生效 -->
    <script src="bbsjump1.js"></script>

</body>
</html>
