<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FM98.6</title>
    <style>
        /* 基础重置与纯黑压抑背景 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden; /* 锁死画面 */
            /* 改用宋体，宋体的笔画带有尖锐的棱角，放大后非常凌厉、刺眼 */
            font-family: "SimSun", "宋体", serif; 
            user-select: none; 
            cursor: crosshair; 
        }

        /* 气泡文字的基础样式 */
        .blood-bubble {
            position: absolute;
            color: #8a0303; /* 干涸、阴郁的暗红色 */
            font-weight: 900; /* 极度加粗，增加重量感与攻击性 */
            white-space: nowrap;
            pointer-events: none; 
            /* 暗黑系的血污光晕，不要太亮，显得更沉闷压抑 */
            text-shadow: 0 0 3px rgba(100, 0, 0, 0.9), 0 0 8px rgba(139, 0, 0, 0.6);
            
            opacity: 0; 
            transform: translate(-50%, -50%) scale(0.1);
            
            animation-name: bubblePop;
            animation-timing-function: ease-in; /* 改为ease-in，让爆发感更突然 */
            animation-fill-mode: forwards;
        }

        /* 更迅猛的关键帧动画 */
        @keyframes bubblePop {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.1);
            }
            15% {
                opacity: 1; /* 瞬间显现 */
                transform: translate(-50%, -60%) scale(1.8);
            }
            80% {
                opacity: 0.8;
            }
            100% {
                opacity: 0; 
                /* 向上漂浮的距离翻倍（-250%），配合更短的时间，视觉速度大幅加快 */
                transform: translate(-50%, -250%) scale(6); 
            }
        }
    </style>
</head>
<body>

    <script>
        function createBubble() {
            const bubble = document.createElement('div');
            bubble.classList.add('blood-bubble');
            
            // 字体基础大小变大一些
            const baseSize = Math.random() * 25 + 16;
            bubble.style.fontSize = `${baseSize}px`;

            // 随机坐标
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            bubble.style.left = `${posX}vw`;
            bubble.style.top = `${posY}vh`;

            // 动画时间大幅缩短：0.6秒 到 1.8秒 之间，速度极快
            const duration = Math.random() * 1.2 + 0.6; 
            bubble.style.animationDuration = `${duration}s`;

            // 随机倾斜角度，制造疯癫的错乱感 (-25度 到 25度)
            const rotation = (Math.random() - 0.5) * 50; 
            
            const innerSpan = document.createElement('span');
            innerSpan.innerText = '快去死';
            innerSpan.style.display = 'inline-block';
            innerSpan.style.transform = `rotate(${rotation}deg)`;
            
            bubble.appendChild(innerSpan);
            document.body.appendChild(bubble);

            // 垃圾回收，防止卡顿
            setTimeout(() => {
                bubble.remove();
            }, duration * 1000);
        }

        // 开局瞬间爆发一波密集的文字
        for(let i = 0; i < 20; i++) {
            setTimeout(createBubble, Math.random() * 400);
        }

        // 核心循环加快：每隔 60 毫秒生成一个（一秒钟涌出近 17 个），极其密集烦躁
        setInterval(createBubble, 60);

    </script>
</body>
</html>
